name: CI

# PRs only. Branch protection requires a PR to be up to date with main before
# it merges, so what lands on main is exactly what this tested: a second run
# after the merge would test the same code again. update-branches.yml keeps
# armed PRs up to date, which is where the re-run happens instead.
on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # CLAUDE.md house style. The two editor pages are exempt: they show an
      # em dash as the "no value" placeholder in their readouts, which is UI,
      # not prose.
      - name: No em dashes in tracked text
        run: |
          if git grep -In $'\xe2\x80\x94' -- . ':!LICENSE' ':!tools/*editor.html'; then
            echo "Em dash found. See CLAUDE.md house style: use a plain hyphen or reword." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
