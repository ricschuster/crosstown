version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Grouped so a bump of three.js and its types, or of the dev tooling, is one
  # PR rather than several. Dependabot PRs are not armed by auto-merge.yml
  # (it is scoped to the owner), so each one is merged by hand.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      three:
        patterns: ['three', '@types/three']
      dev-dependencies:
        dependency-type: development
